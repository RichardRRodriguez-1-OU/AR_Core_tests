<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>San Carlos 3D Viewer</title>

  <!-- Google Model Viewer -->
  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
  </script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eeeeee;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      background-color: #eeeeee;
    }

  </style>
</head>

<body>

  <model-viewer
    src="SanCarlosPhone.glb"
    alt="3D model of San Carlos"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1">
  </model-viewer>

</body>

</html>
